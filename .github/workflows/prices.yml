name: Official price snapshots
on:
  schedule:
    - cron: '17 22 * * *' # 06:17 Asia/Shanghai
  workflow_dispatch:
  push:
    paths:
      - '*.py'
      - 'registry.json'
      - 'policy.json'
      - 'tests/**'
      - '.github/workflows/prices.yml'
permissions:
  contents: write
concurrency:
  group: official-price-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test parsers and guardrails
        run: python3 -m unittest discover -s tests -v
      - name: Check official sources
        id: sync
        continue-on-error: true
        run: python3 sync_prices.py
      - name: Publish only public data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(prices): refresh official snapshots'
            git push
          fi
      - name: Report source failure
        if: steps.sync.outcome == 'failure'
        run: exit 1
